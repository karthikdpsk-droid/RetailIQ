# Parameters match the selected serialized Random Forest approach in v1.0.2.
champion_parameters:
  n_estimators: 60
  max_depth: 20
  min_samples_leaf: 4
  random_state: 42
  n_jobs: -1
candidate_parameters:
  n_estimators: 60
  max_depth: 20
  min_samples_leaf: 4
  random_state: 42
  n_jobs: -1
acceptance:
  # Require a material >=1% MAE improvement while RMSE and R2 do not regress.
  minimum_mae_improvement_fraction: 0.01
