spring.application.name=api-service

spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/retailiq_db}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

retailiq.ml.base-url=${RETAILIQ_ML_BASE_URL:${ML_SERVICE_BASE_URL:http://localhost:8000}}
retailiq.ml.connect-timeout=${RETAILIQ_ML_CONNECT_TIMEOUT:2s}
retailiq.ml.read-timeout=${RETAILIQ_ML_READ_TIMEOUT:10s}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
spring.main.banner-mode=off

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.retailiq.api=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
