
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve the React frontend and support client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the Spring Boot backend
    location /api/ {
        proxy_pass https://retailiq-api-7rgm.onrender.com;
        proxy_http_version 1.1;

        # HTTPS / SSL configuration
        proxy_ssl_server_name on;
        proxy_ssl_name retailiq-api-7rgm.onrender.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # Forward request headers
        proxy_set_header Host retailiq-api-7rgm.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow time for the backend to respond
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Handle gateway and server errors
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
